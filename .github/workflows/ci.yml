name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers uses the Docker socket that ubuntu-latest runners
      # provide by default. Sanity-check it's reachable before running the
      # suite so a Docker-availability regression fails clearly rather than
      # inside a random Testcontainers error.
      - name: Verify Docker is reachable
        run: docker version

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
