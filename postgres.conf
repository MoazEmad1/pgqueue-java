# Committed deliberately: benchmark results are meaningless without the config
# that produced them. Every value here is part of the experimental record.

listen_addresses = '*'
max_connections = 300

# Reserve 5 slots for superusers so the diagnostic LockCollector can always
# open a connection, even under pool exhaustion or the M3-style wedge where
# every application connection is blocked in a lock wait. Default is 3;
# making it explicit keeps the observability guarantee part of the record.
superuser_reserved_connections = 5

shared_buffers = 512MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- Autovacuum -------------------------------------------------------------
# Left at DEFAULTS on purpose. Tuning these is one of the mitigations to be
# measured, not a starting assumption.
autovacuum = on

# --- Observability ----------------------------------------------------------
track_io_timing = on
log_autovacuum_min_duration = 0
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
